<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>T-Shirt Designer</title>
  <meta name="description" content="Position, resize and rotate images on the front and back of a T-shirt, change the shirt and background colours, and export mockups and print-ready files.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M8.5 3.5L3 6.5l2 5 2.5-1.2V20.5h9V10.3l2.5 1.2 2-5-5.5-3a3.5 3.5 0 0 1-7 0z' fill='%234f46e5'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #f5f6f8; }
    @media (prefers-color-scheme: dark) { html, body { background: #121418; } }
    tshirt-designer { display: block; height: 100vh; height: 100dvh; border-radius: 0; }
    tshirt-designer:not(:defined) { visibility: hidden; }
    noscript { display: block; padding: 2rem; font: 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <tshirt-designer theme="auto" autosave="standalone"></tshirt-designer>
  <noscript>The T-Shirt Designer needs JavaScript.</noscript>

  <script src="assets/samples.js"></script>
  <script>
    /*
     * Standalone page glue.
     *
     * URL parameters (all optional):
     *   ?theme=light|dark|auto   ?shirt-color=%23000000   ?background=%23eeeeee | transparent
     *   ?view=front|back   ?units=in|cm   ?print-area=12x16   ?hide=library,layers   ?readonly=1
     *   ?autosave=0              turn off restoring the last design from this browser
     *   ?bridge=<origin>[,<origin>]   accept postMessage commands from a parent page (iframe embedding)
     *   ?exports=parent          with ?bridge: send exported files to the parent instead of downloading
     */
    (function () {
      var el = document.querySelector('tshirt-designer');
      var params = new URLSearchParams(location.search);
      var inFrame = window.parent !== window;

      ['theme', 'shirt-color', 'background', 'view', 'units', 'print-area', 'hide', 'name'].forEach(function (k) {
        if (params.has(k)) el.setAttribute(k, params.get(k));
      });
      if (params.get('readonly') === '1') el.setAttribute('readonly', '');
      // When embedded in another site, don't restore designs saved by the standalone page.
      if (params.get('autosave') === '0' || (inFrame && !params.has('autosave'))) el.removeAttribute('autosave');
      else if (params.get('autosave')) el.setAttribute('autosave', params.get('autosave'));
      if (window.TSD_SAMPLES) el.samples = window.TSD_SAMPLES;

      /* ---------- optional postMessage bridge for <iframe> embedding ---------- */
      var bridge = params.get('bridge');
      if (!bridge || !inFrame) return;
      var allowed = bridge.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      var anyOrigin = allowed.indexOf('*') !== -1;
      var target = anyOrigin ? '*' : allowed[0];
      var METHODS = ['addImage', 'addImages', 'getLayers', 'getLayer', 'selectLayer', 'updateLayer', 'removeLayer',
        'setView', 'setShirtColor', 'setBackground', 'setPrintArea', 'undo', 'redo', 'clear', 'reset',
        'getDesign', 'loadDesign', 'export', 'exportImage', 'exportPDF', 'exportSVG', 'exportZip', 'download',
        'openExportDialog', 'zoomToFit', 'setZoom'];

      function post(msg) { try { window.parent.postMessage(msg, target); } catch (e) { /* parent gone */ } }
      function plain(v) {
        if (v == null || v instanceof Blob) return v;
        if (Array.isArray(v)) return v.map(plain);
        if (typeof v === 'object') { try { return JSON.parse(JSON.stringify(v)); } catch (e) { return null; } }
        return v;
      }

      window.addEventListener('message', function (e) {
        if (!(anyOrigin || allowed.indexOf(e.origin) !== -1)) return;
        var m = e.data;
        if (!m || m.tsd !== 'call') return;
        var reply = function (payload) { payload.tsd = 'result'; payload.id = m.id; e.source.postMessage(payload, anyOrigin ? '*' : e.origin); };
        if (METHODS.indexOf(m.method) === -1) { reply({ error: 'Unknown method: ' + m.method }); return; }
        customElements.whenDefined('tshirt-designer').then(function () { return el.ready; })
          .then(function () { return el[m.method].apply(el, m.args || []); })
          .then(function (result) { reply({ result: plain(result) }); })
          .catch(function (err) { reply({ error: String((err && err.message) || err) }); });
      });

      var sendExports = params.get('exports') === 'parent';
      ['tsd-ready', 'tsd-change', 'tsd-select', 'tsd-view', 'tsd-error', 'tsd-export'].forEach(function (type) {
        el.addEventListener(type, function (ev) {
          var d = ev.detail || {};
          if (type === 'tsd-export') {
            if (sendExports) ev.preventDefault();
            post({ tsd: 'event', type: type, detail: { filename: d.filename, format: d.format, side: d.side, blob: sendExports ? d.blob : undefined } });
            return;
          }
          if (type === 'tsd-error') d = { message: d.message, error: d.error ? String(d.error.message || d.error) : null };
          post({ tsd: 'event', type: type, detail: plain(d) });
        });
      });
    })();
  </script>
  <!-- Loaded last so the attributes above are in place before the element starts. -->
  <script src="tshirt-designer.js"></script>
</body>
</html>
