<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embedding example — iframe + postMessage</title>
  <style>
    body { margin: 0; font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f4f7; color: #1b1b25; }
    .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px; }
    iframe { width: 100%; height: 720px; border: 1px solid #dcdce4; border-radius: 14px; background: #fff; }
    .panel { background: #fff; border: 1px solid #dcdce4; border-radius: 14px; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 4px; } p { margin: 0 0 14px; color: #5c5c70; }
    button { display: block; width: 100%; height: 36px; margin: 0 0 8px; border-radius: 9px; border: 1px solid #dcdce4; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { border-color: #b9b9c8; }
    img { width: 100%; border-radius: 10px; border: 1px solid #dcdce4; margin-top: 6px; }
    pre { margin: 10px 0 0; padding: 10px; border-radius: 10px; background: #f6f6f9; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; max-height: 180px; overflow: auto; }
    @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <iframe id="frame" title="T-shirt designer" allow="clipboard-write"></iframe>
    <div class="panel">
      <h1>Host page</h1>
      <p>This page talks to the designer inside the iframe with <code>postMessage</code>. Exports are sent back here instead of downloading.</p>
      <button data-call='["setShirtColor", ["#c8102e"]]'>Red shirt</button>
      <button data-call='["setShirtColor", ["#1f2a44"]]'>Navy shirt</button>
      <button data-call='["setView", ["back"]]'>Show back</button>
      <button data-call='["setBackground", ["gradient(#fdf2e9, #e8c9a8)"]]'>Warm gradient background</button>
      <button id="png">Get front PNG</button>
      <button data-call='["openExportDialog", []]'>Open the export dialog</button>
      <img id="out" alt="" hidden>
      <pre id="log">Waiting for the designer…</pre>
    </div>
  </div>
  <script>
    // The designer only accepts commands from origins listed in ?bridge= (use your real origin in production).
    const ORIGIN = location.protocol === 'file:' ? '*' : location.origin;
    const frame = document.getElementById('frame');
    frame.src = '../index.html?bridge=' + encodeURIComponent(ORIGIN) + '&exports=parent&hide=file';
    const logEl = document.getElementById('log');
    const log = (m) => { logEl.textContent = (logEl.textContent.startsWith('Waiting') ? '' : logEl.textContent) + m + '\n'; logEl.scrollTop = logEl.scrollHeight; };

    let seq = 0;
    const pending = new Map();
    /** Call a designer method inside the iframe; resolves with its result. */
    function call(method, ...args) {
      return new Promise((resolve, reject) => {
        const id = ++seq;
        pending.set(id, { resolve, reject });
        frame.contentWindow.postMessage({ tsd: 'call', id, method, args }, ORIGIN);
      });
    }
    function showBlob(blob) {
      const img = document.getElementById('out');
      img.src = URL.createObjectURL(blob);
      img.hidden = false;
    }
    window.addEventListener('message', (e) => {
      if (e.source !== frame.contentWindow || !e.data) return;
      const m = e.data;
      if (m.tsd === 'result' && pending.has(m.id)) {
        const p = pending.get(m.id); pending.delete(m.id);
        if (m.error) p.reject(new Error(m.error)); else p.resolve(m.result);
      } else if (m.tsd === 'event') {
        log('event ' + m.type + (m.detail && m.detail.reason ? ': ' + m.detail.reason : '') + (m.detail && m.detail.filename ? ': ' + m.detail.filename : ''));
        if (m.type === 'tsd-export' && m.detail.blob && m.detail.blob.type.startsWith('image/')) showBlob(m.detail.blob);
      }
    });
    document.querySelectorAll('[data-call]').forEach((b) => b.addEventListener('click', () => {
      const [method, args] = JSON.parse(b.dataset.call);
      call(method, ...args).then(() => log('ok: ' + method), (err) => log('error: ' + err.message));
    }));
    document.getElementById('png').addEventListener('click', async () => {
      try { showBlob(await call('exportImage', { format: 'png', side: 'front', width: 800 })); log('received front PNG'); }
      catch (err) { log('error: ' + err.message); }
    });
  </script>
</body>
</html>
